<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메일 접근 테스트</title>
<meta name="robots" content="noindex">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--bg:#f1f2ee;--surface:#fff;--ink:#18221f;--muted:#66706b;--line:#d9ddd5;--soft:#e9ece5;--accent:#1f5f4f;--accent-ink:#fff;--ok:#2f7d4f;--danger:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111614;--surface:#19201d;--ink:#e4ebe7;--muted:#97a39d;--line:#2b3531;--soft:#222b27;--accent:#6fc3a8;--accent-ink:#0d1714;--ok:#6fd096;--danger:#ff8173;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111614;--surface:#19201d;--ink:#e4ebe7;--muted:#97a39d;--line:#2b3531;--soft:#222b27;--accent:#6fc3a8;--accent-ink:#0d1714;--ok:#6fd096;--danger:#ff8173;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}
p{margin:0}
.fine{font-size:13px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--danger);font-weight:700}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
li small{color:var(--muted)}
code{background:var(--soft);border-radius:6px;padding:1px 5px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>메일 접근 테스트</h1>
  <p class="fine">회사 구글 메일에 이 앱이 접근할 수 있는지만 확인해요. <b>보낸 편지함 최근 5개의 제목·날짜만</b> 이 화면에 잠깐 보여주고, 어디에도 저장하지 않아요. 메일 내용은 권한상 읽을 수 없어요(제목·받는 사람·날짜만 보는 권한).</p>

  <div class="box">
    <label>OAuth 클라이언트 ID<input id="cid" placeholder="1234567890-xxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false"></label>
    <div class="row"><button type="button" class="primary" id="go">구글 로그인하고 테스트</button><button type="button" id="rv" disabled>연결 끊기</button></div>
    <p class="fine">클라이언트 ID는 비밀번호가 아니에요. 이 브라우저에만 기억해 둬요.</p>
  </div>

  <div class="box" id="out" hidden></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SCOPE='https://www.googleapis.com/auth/gmail.metadata';
let token=null;
try{$('cid').value=localStorage.getItem('gmail-test-cid')||''}catch(e){}
const show=html=>{$('out').hidden=false;$('out').innerHTML=html};
const why={
  access_denied:'로그인 창에서 거절됐어요. 회사 관리자 설정으로 막혔거나, 허용 화면에서 취소를 눌렀을 수 있어요.',
  admin_policy_enforced:'회사(Workspace) 관리자 설정으로 막혀 있어요. 관리자에게 이 앱 허용을 요청해야 해요.',
  popup_closed:'로그인 창이 닫혔어요. 다시 눌러 주세요.',
  popup_failed_to_open:'팝업이 막혔어요. 주소창 오른쪽의 팝업 차단을 풀어 주세요.'
};
$('go').onclick=()=>{
  const cid=$('cid').value.trim();
  if(!/\.apps\.googleusercontent\.com$/.test(cid)){show('<p class="bad">클라이언트 ID 모양이 아니에요</p><p class="fine">…apps.googleusercontent.com 으로 끝나는 값을 넣어 주세요.</p>');return}
  try{localStorage.setItem('gmail-test-cid',cid)}catch(e){}
  if(!window.google||!google.accounts||!google.accounts.oauth2){show('<p class="bad">구글 로그인 도구를 못 불러왔어요</p><p class="fine">새로고침하고 다시 해 주세요.</p>');return}
  const tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPE,prompt:'consent',
    callback:async r=>{
      if(r.error){show(`<p class="bad">접근 안 됨</p><p>${esc(why[r.error]||'')}</p><p class="fine">오류 코드: <code>${esc(r.error)}</code> ${esc(r.error_description||'')}</p>`);return}
      token=r.access_token; $('rv').disabled=false; await test();
    },
    error_callback:e=>{show(`<p class="bad">로그인이 끝나지 않았어요</p><p>${esc(why[e.type]||'')}</p><p class="fine">오류 종류: <code>${esc(e.type||'')}</code></p>`)}
  });
  tc.requestAccessToken();
};
async function api(path){
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path,{headers:{Authorization:'Bearer '+token}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;e.reason=j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason;throw e}
  return j;
}
async function test(){
  show('<p>보낸 편지함 확인 중…</p>');
  try{
    const prof=await api('profile');
    const L=await api('messages?labelIds=SENT&maxResults=5');
    const items=[];
    for(const m of (L.messages||[])){
      const d=await api(`messages/${m.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=To&metadataHeaders=Date`);
      const h=n=>((d.payload&&d.payload.headers)||[]).find(x=>x.name.toLowerCase()===n.toLowerCase());
      const to=(h('To')||{}).value||'', dom=(to.match(/@([^>\s,]+)/)||[])[1]||'';
      const dt=new Date(+d.internalDate);
      items.push(`<li>${esc((h('Subject')||{}).value||'(제목 없음)')}<br><small>${dt.getMonth()+1}/${dt.getDate()} · 받는 쪽 @${esc(dom)}</small></li>`);
    }
    show(`<p class="ok">접근 돼요 🎉</p><p class="fine">${esc(prof.emailAddress)} 계정 · 보낸 메일 최근 ${items.length}개 (화면에만 보이고 저장 안 돼요)</p><ul>${items.join('')||'<li>보낸 메일이 없어요</li>'}</ul><p class="fine">확인했으면 '연결 끊기'를 눌러 권한을 돌려주세요.</p>`);
  }catch(e){
    const hint=e.status===403&&/accessNotConfigured|SERVICE_DISABLED/i.test(e.reason+' '+e.message)?'구글 클라우드에서 Gmail API가 아직 꺼져 있어요. 켜고 몇 분 뒤 다시 해 주세요.':e.status===403?'권한이 막혔어요. 회사 관리자 설정일 가능성이 커요.':'';
    show(`<p class="bad">로그인은 됐는데 메일 확인이 안 됐어요</p><p>${esc(hint)}</p><p class="fine">오류: <code>${esc(e.message)}</code></p>`);
  }
}
$('rv').onclick=()=>{
  if(!token)return;
  google.accounts.oauth2.revoke(token,()=>{token=null;$('rv').disabled=true;show('<p class="ok">연결을 끊었어요</p><p class="fine">구글 계정 → 보안 → 서드 파티 앱 목록에서도 사라졌는지 확인해 보세요.</p>')});
};
})();
</script>
</body>
</html>
